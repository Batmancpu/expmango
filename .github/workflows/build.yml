name: Build EXP Mango

on:
  push:
    branches: [main, exp-mango-wm]
  workflow_dispatch:

concurrency:
  group: exp-mango-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare EXP Mango source
        run: bash scripts/prepare-exp-mango.sh

      - name: Build EXP Mango Lite
        run: cd wmkeyboard && ./gradlew assembleLiteEnDebug -Pwmkb.noInternet=true

      - name: Collect APK
        run: cp wmkeyboard/app/build/outputs/apk/liteEn/debug/app-liteEn-debug.apk EXP-Mango-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXP-Mango-debug
          path: EXP-Mango-debug.apk
          retention-days: 14

      - name: Create test Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exp-mango-test-${{ github.run_number }}
          name: EXP Mango Test ${{ github.run_number }}
          files: EXP-Mango-debug.apk
          prerelease: true
          generate_release_notes: true
