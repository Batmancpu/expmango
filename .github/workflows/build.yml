name: Build EXP Mango

on:
  push:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: exp-mango-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Offline & Privacy Audit
        run: bash scripts/audit-offline.sh

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Check signing availability
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EXP_MANGO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EXP_MANGO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EXP_MANGO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EXP_MANGO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.EXP_MANGO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build EXP Mango Release
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.EXP_MANGO_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.EXP_MANGO_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.EXP_MANGO_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Build EXP Mango Debug
        if: steps.signing.outputs.available != 'true'
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -q "B7:2B:86:49:17:9C:6E:D4:5B:C6:BE:FB:68:99:E8:DA:95:28:70:75:A9:9F:AD:60:85:B6:98:6C:BC:ED:23:B2"

      - name: Collect APK
        run: |
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk EXP-Mango.apk
          else
            APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
            test -n "$APK"
            cp "$APK" EXP-Mango-debug.apk
            cp "$APK" EXP-Mango.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-Mango-test
          path: |
            EXP-Mango.apk
            EXP-Mango-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: success() && steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exp-mango-v${{ github.run_number }}
          name: EXP Mango v1.0.${{ github.run_number }}
          files: EXP-Mango.apk
          prerelease: true
          generate_release_notes: true

      - name: Wipe signing key
        if: always()
        run: rm -f release.keystore
